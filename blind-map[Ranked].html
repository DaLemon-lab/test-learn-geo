<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blind Map</title>
<style>
:root{--sea:#6fa6dd;--ink:#1b2a3a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);font:15px/1.4 "Trebuchet MS",Verdana,sans-serif;color:var(--ink)}
svg{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.c{fill:#fff;stroke:#333;stroke-width:.6;vector-effect:non-scaling-stroke}
.c.off{fill:#dcdcdc}
.c.hot{fill:#ffe9a0}
.c.ok{fill:#8fd694}
.c.bad{fill:#f4a0a0}
.oc{fill:#123e73;font-style:italic;text-anchor:middle;paint-order:stroke;stroke:#ffffffaa;stroke-width:3px}
.box{background:rgba(255,255,255,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 8px 30px #0004;border:1px solid #fff9}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,94vh,640px);aspect-ratio:1;padding:22px;display:flex;flex-direction:column;gap:10px;z-index:5}
#panel h1{margin:0;font-size:28px;letter-spacing:.5px}
#panel p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:inherit;background:#fff;border:1px solid #333;padding:5px 10px;cursor:pointer}
button:hover{background:#ffe9a0}
button:focus-visible,input:focus-visible{outline:3px solid #123e73;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row span{margin-inline-start:auto}
#q{font:inherit;padding:9px 12px;border:1px solid #333;background:#fff;width:100%}
.res{max-height:132px;overflow:auto;background:#fff;border:1px solid #333;display:flex;flex-direction:column}
.res button{border:0;border-bottom:1px solid #3332;text-align:left;padding:6px 12px}
.res button.on{background:#d4efd6}
.res p{padding:6px 12px;color:#555}
.picked{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;padding:8px;background:#fff8;border:1px solid #3334}
.picked p{color:#444}
.tag{background:#fff;border:1px solid #333;padding:3px 9px}
.go{background:#1d4f8a;color:#fff;border-color:#123e73;padding:10px;font-size:17px}
.go:hover{background:#2a66ad}
.go:disabled{opacity:.5;cursor:not-allowed}
#hud{position:fixed;left:12px;top:12px;padding:10px 14px;z-index:4;display:flex;gap:14px;align-items:center}
#side{position:fixed;right:12px;top:62px;bottom:12px;width:min(230px,42vw);padding:8px;overflow:auto;z-index:4}
.it{padding:8px 10px;margin:0 0 5px;background:#fff;border:1px solid #333;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.it.lift{opacity:.35}
.it.shake{animation:sh .3s}
.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:9;box-shadow:0 6px 16px #0006;width:200px;margin:0}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.it.shake{animation:none}}

#panel.auto{aspect-ratio:auto;height:auto;max-height:94vh;overflow:auto}
#panel.tall{aspect-ratio:auto;height:min(96vh,900px);overflow:auto}
.picked{min-height:70px}
button.on{background:#d4efd6;border-color:#1d4f8a;font-weight:bold}
#me{position:fixed;right:12px;top:12px;z-index:7;display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;max-width:220px}
#me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;color:#fff;font-weight:bold;flex:none}
#pm{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:center;justify-content:center}
#pm .card{padding:20px;width:min(92vw,340px);display:flex;flex-direction:column;gap:12px}
#pm input[type=text],#jc{font:inherit;padding:9px 12px;border:1px solid #333;background:#fff;width:100%}
#jc{flex:1;text-transform:uppercase;letter-spacing:3px}
.pav{display:flex;justify-content:center}
.btn{display:inline-block;background:#fff;border:1px solid #333;padding:5px 10px;cursor:pointer}
.btn:hover{background:#ffe9a0}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-weight:bold;letter-spacing:4px;font-size:20px;padding:2px 10px}
.muted{color:#555}
.err{color:#b3261e;margin:0;min-height:0}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tm{background:#fff8;border:1px solid #3334;padding:6px;min-height:60px}
.th{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:4px}
.t0,.tm.t0 .th{color:#1d4f8a}.t1,.tm.t1 .th{color:#b4501f}
.tcol{font-weight:bold}
.pl{display:flex;align-items:center;gap:8px;padding:3px 0}
.plist{display:flex;flex-wrap:wrap;gap:4px 18px}
.it.taken{opacity:.4;pointer-events:none;outline:2px solid rgba(30,110,255,.6)}
.it.taken::after{content:attr(data-by);float:right;font-size:11px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat,.mvp{background:#fff;border:1px solid #333;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.mvp{background:#fff3c4;border-color:#b08a00}
.ct{font-weight:bold}
.cw{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.w{display:inline-flex;align-items:center;gap:6px}
.cv{color:#555;font-size:13px}
.curs,.rc{pointer-events:none}
.rc{transition:transform .09s linear}
.cp{fill:rgba(30,110,255,.45);stroke:rgba(20,70,200,.75);stroke-width:1}
.cn{font-size:11px;fill:#123e73;paint-order:stroke;stroke:#fffb;stroke-width:3px}
.ci rect{fill:rgba(30,110,255,.35);stroke:rgba(20,70,200,.7)}
.ci text{font-size:12px;fill:#0b2a5c;paint-order:stroke;stroke:#fffb;stroke-width:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2a3a;color:#fff;padding:9px 16px;z-index:30}
@media (max-width:520px){.cats,.teams{grid-template-columns:1fr}}

.rb{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:bold;color:#fff;flex:none;border:2px solid #0003}
.bar{height:10px;background:#fff;border:1px solid #333;margin-top:6px}.bar i{display:block;height:100%;background:#1d4f8a}
.rkcard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #333;padding:10px}
.lad{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.lad>div,.lad>button{display:flex;align-items:center;gap:8px;padding:4px 8px;background:#fff8;text-align:start}
.lad>div small,.lad>button small{margin-inline-start:auto}
.lad .me{outline:2px solid #1d4f8a;background:#fff}
.lad.one{grid-template-columns:1fr}.lad .botb{background:#fff;border:1px solid #333}
.rkb{display:inline-flex;align-items:center;gap:6px}
.bt{background:#b4501f;border-color:#8a3a12}.bt:hover{background:#cf642f}
#pm .card.wide{width:min(94vw,580px);max-height:90vh;overflow:auto}
.opt{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.opt input{margin-top:5px;width:18px;height:18px}
.lbc{display:flex;flex-direction:column;gap:10px}
.lbt{width:100%;border-collapse:collapse;background:#fff}.lbt th,.lbt td{padding:5px 8px;border-bottom:1px solid #3332;text-align:start}
.lbt tr.me{background:#d4efd6}
.sep{width:12px}
#tip{position:fixed;transform:translate(16px,18px);pointer-events:none;z-index:9;background:#fff;border:1px solid #333;padding:4px 12px;font-weight:bold;font-size:17px;box-shadow:0 6px 16px #0005;white-space:nowrap}
#tip.shake{animation:sh .3s}
.want{font-weight:bold;color:#1d4f8a}.botp{color:#b4501f;font-weight:bold}
[hidden]{display:none!important}
</style>
</head>

const RK_N = [10,10,12,12,14,14,16,18,20], RK_WIN = [30,28,26,24,22,20,18,16,15], RK_LOSE = [0,12,14,16,18,20,22,24,26];
const rankOf = rp => { let i = 0; RP_AT.forEach((v,j) => { if (rp >= v) i = j; }); return i; };
const rankName = i => lang === 'he' ? RANK_HE[i] : RANKS[i][0];

function syncRanked(){ lb.ranked[uid] = {name:prof.name, pfp:prof.pfp, rp:rk.rp, w:rk.w, l:rk.l}; saveLB(); }

}

    const a = f => nm(f).toLowerCase(), e = f => f.properties.name.toLowerCase();
    const hit = list.filter(f => a(f).includes(q) || e(f).includes(q));
    return hit.sort((x,y) => (a(y).startsWith(q) || e(y).startsWith(q)) - (a(x).startsWith(q) || e(x).startsWith(q))).slice(0,40);
  };
  const results = () => {
    const m = matches(), r = $('#res');
    r.hidden = !$('#q').value.trim();
    r.innerHTML = m.length ? m.map(f => `<button data-t="${f.i}" class="${sel.has(f.i)?'on':''}">${sel.has(f.i)?'✓ ':''}${nm(f)}</button>`).join('') : `<p>${t('nomatch')}</p>`;
  };
  const refresh = () => {
    const chosen = list.filter(f => sel.has(f.i));
    $('#picked').innerHTML = chosen.length ? chosen.map(f => `<button class="tag" data-rm="${f.i}" title="${t('rm')}">${nm(f)} ×</button>`).join('') : `<p>${t('empty')}</p>`;
    $('#oc').checked = oceans;
    $('#cnt').textContent = T[lang].cnt(sel.size, oceans) + (curMode && !mp ? ' · 🏆 ' + modeLabel(curMode) : '');
    $('#go').disabled = !sel.size && !oceans; if ($('#botb')) $('#botb').disabled = $('#go').disabled;
    results();
    if (mp && mp.host) pushLobby();
  };
  p.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.a) roomAction(d.a);
    else if (b.id==='setb') openSettings();
    else if (b.id==='lbb') openLB();
    else if (b.id==='rkb') rankedScreen();
    else if (b.id==='botb') openBotPick();
    else if (b.id==='mpb') mpEntry();
    else if (d.m){ sel = d.m==='Oceans only' ? new Set() : new Set(list.filter(f=>inMode(f,d.m)).map(f=>f.i)); oceans = d.m==='Oceans only'; curMode = d.m; refresh(); }
    else if (d.t){ const i = +d.t; sel.has(i) ? sel.delete(i) : sel.add(i); curMode = null; refresh(); }
    else if (d.rm){ sel.delete(+d.rm); curMode = null; refresh(); }
    else if (b.id==='all'){ sel = new Set(list.map(f=>f.i)); curMode = oceans ? null : 'World'; refresh(); }
    else if (b.id==='none'){ sel.clear(); oceans = false; curMode = null; $('#q').value = ''; refresh(); }
    else if (b.id==='go') mp ? hostStart() : start();
  };
  p.oninput = e => { if (e.target.id==='q') results(); };
  p.onkeydown = e => {
    if (e.target.id==='q' && e.key==='Enter'){ const m = matches()[0]; if (m){ sel.add(m.i); curMode = null; e.target.value = ''; refresh(); } }
  };
  p.onchange = e => { if (e.target.id==='oc'){ oceans = e.target.checked; curMode = null; refresh(); } };
  refresh();
}

function drawMap(playing){
  const W = innerWidth, H = innerHeight, sw = playing ? sideW() : 0;
  proj = d3.geoNaturalEarth1().fitExtent([[16,16],[W - sw - 16, H - 16]], {type:'Sphere'});
  path = d3.geoPath(proj);
  g = svg.append('g');
  g.selectAll('path').data(feats).join('path').attr('class', f => 'c' + (playing && sel.has(f.i) ? '' : ' off'))
    .classed('off', f => playing ? !sel.has(f.i) : false).attr('d', path).attr('data-i', f => f.i);
  zoom = d3.zoom().scaleExtent([1,60]).on('zoom', e => {
    g.attr('transform', e.transform); curK = e.transform.k;
    g.selectAll('.oc').attr('font-size', 15/curK);
    g.selectAll('.cs').attr('transform', `scale(${1/curK})`);
  });
  svg.call(zoom).on('dblclick.zoom', null);
}

// ================= game core =================

function begin(keys, ll, botTier){

    const aw = W - sw - 40, ah = H - 80, k = Math.max(1, Math.min(40, .92*Math.min(aw/(x1-x0), ah/(y1-y0))));

const myBoard = () => mp && mp.type === 'vs' ? mp.team : 0;

}

function under(x,y){ const el = document.elementFromPoint(x,y); return el && el.classList && el.classList.contains('c') ? el : null; }
let hotEl = null;
function hot(x,y){ const el = under(x,y); if (el===hotEl) return; hotEl && hotEl.classList.remove('hot'); hotEl = el; el && !el.classList.contains('ok') && el.classList.add('hot'); }

function onDown(e){
  const it = e.target.closest('.it'); if (!it || it.classList.contains('taken')) return;
  e.preventDefault(); it.setPointerCapture(e.pointerId);
  const k = it.dataset.k;
  const gh = it.cloneNode(true); gh.className = 'it ghost'; document.body.append(gh); it.classList.add('lift');
  const abort = () => { it.onpointermove = it.onpointerup = it.onpointercancel = null; gh.remove(); it.classList.remove('lift'); hot(-1,-1); curDrag = null; };
  const mv = ev => { gh.style.left = ev.clientX+'px'; gh.style.top = ev.clientY+'px'; hot(ev.clientX, ev.clientY); };
  const end = (ev, cancel) => { abort(); if (cancel){ if (mp) act({t:'drop', k, cancel:1}); } else drop(it, ev.clientX, ev.clientY); };
  curDrag = {abort};
  if (mp) act({t:'grab', k});
  mv(e);
  it.onpointermove = mv; it.onpointerup = ev => end(ev,false); it.onpointercancel = ev => end(ev,true);
}

function markPlaced(k){
  const i = +k.slice(1);
  if (k[0]==='c') g.select(`path[data-i="${i}"]`).classed('ok', true);
  else if (g.select(`text[data-o="${i}"]`).empty()){
    const o = OCEANS[i], c = proj([o[1],o[2]]);
    g.append('text').attr('class','oc').attr('data-o',i).attr('x',c[0]).attr('y',c[1]).attr('font-size',15/d3.zoomTransform(svg.node()).k).text(oname(i));
    cl && cl.raise();
  }
}

function drop(it, x, y){
  const k = it.dataset.k;
  if (x > innerWidth - sideW()){ if (mp) act({t:'drop', k, cancel:1}); return; } // dropped back on the list
  const el = under(x,y); let ok = false;
  if (k[0]==='c'){
    ok = !!el && el.dataset.i === k.slice(1);
  } else if (!el){
    const o = OCEANS[+k.slice(1)], p = d3.zoomTransform(svg.node()).invert([x,y]), ll = proj.invert(p);
    if (ll && isFinite(ll[0]) && d3.geoDistance(ll,[o[1],o[2]]) < o[3]) ok = true;
  }
  if (ok){
    markPlaced(k); it.remove();
    if (mp){ act({t:'drop', k, ok:true}); return; }
    if (!--state.left) finish(); else hud();
    return;
  }
  if (mp) act({t:'drop', k, ok:false}); else { state.miss++; hud(); }
  it.classList.add('shake'); setTimeout(() => it.classList.remove('shake'), 300);
  if (el && !el.classList.contains('ok')){ el.classList.add('bad'); setTimeout(() => el.classList.remove('bad'), 500); }
}

function finish(lost){
  clearInterval(timer); playing = false; scr = 'results'; $('#tip').hidden = true;
  const B = bot, wasRanked = ranked, placedN = state.total - state.left; stopBot();
  const sec = Math.round((Date.now() - state.t0) / 100) / 10, tm = fmtT(sec), p = $('#panel');

function renderRoomHead(){ const el = $('#rh'); if (!el || scr !== 'menu' || !mp || !mp.host) return; el.innerHTML = roomHTML(lobbyMsg(), true); }

function roomAction(a){

  if (a === 'leave') leaveRoom();

  else if (a.startsWith('ty:') && mp.host){ mp.type = a.slice(3); pushLobby(); }
  else if (a.startsWith('team:')){

    if (mp.host){ mp.P[mp.id].team = tm; pushLobby(); } else if (mp.conn.open) mp.conn.send({t:'team', team:tm});
  }
  else if (a === 'shuf' && mp.host){ shuffle(Object.keys(mp.P)).forEach((id,i) => mp.P[id].team = i % 2); pushLobby(); }
}
function leaveRoom(msgKey){
  try { mp && mp.peer.destroy(); } catch(e){}
  mp = null; G = null; playing = false; cl = null; cur = {}; mpSnap = null;
  menu(); if (msgKey) toast(t(msgKey));
}

// ================= multiplayer: networking (PeerJS / WebRTC) =================
const genCode = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };
const bc = (msg, f) => { if (!mp || !mp.conns) return; for (const id in mp.conns){ const c = mp.conns[id]; if (c.open && (!f || f(id))) c.send(msg); } };
const sendTo = (id, msg) => { if (id === mp.id) clientMsg(msg); else { const c = mp.conns[id]; c && c.open && c.send(msg); } };
const act = msg => { if (!mp) return; if (mp.host) hostApply(mp.id, msg); else if (mp.conn.open) mp.conn.send(msg); };

function createRoom(){
  if (typeof Peer === 'undefined') return toast(t('neterr'));
  toast(t('connecting'));
  const make = n => {
    const code = genCode(), peer = new Peer('blindmap-' + code);
    peer.on('open', id => {
      mp = {host:true, peer, id, hostId:id, code, type:'casual', phase:'lobby', P:{}, conns:{}};
      mp.P[id] = {id, name:prof.name, pfp:prof.pfp, team:0};
      peer.on('connection', hostConn);
      $('#toast').hidden = true; menu();
    });
    peer.on('error', e => {
      if (mp) return;
      try { peer.destroy(); } catch(x){}
      if (e.type === 'unavailable-id' && n < 5) make(n + 1); else toast(t('neterr'));
    });
  };
  make(0);
}
function hostConn(conn){
  conn.on('data', m => {
    if (!m || typeof m !== 'object' || !mp) return;
    if (m.t === 'hello'){
      if (mp.conns[conn.peer]) return;
      if (mp.phase !== 'lobby'){ conn.send({t:'rej', why:'started'}); return; }
      const ps = Object.values(mp.P);
      if (ps.length >= 8){ conn.send({t:'rej', why:'full'}); return; }
      const t0 = ps.filter(q => q.team === 0).length, t1 = ps.length - t0;
      mp.conns[conn.peer] = conn;
      mp.P[conn.peer] = {id:conn.peer, name:cleanName(m.name), pfp:cleanPfp(m.pfp), team:t0 <= t1 ? 0 : 1};
      pushLobby(); return;
    }
    if (mp.P[conn.peer]) hostApply(conn.peer, m);
  });
  conn.on('close', () => dropPlayer(conn.peer));
  conn.on('error', () => dropPlayer(conn.peer));
}
function dropPlayer(id){
  if (!mp || !mp.P[id]) return;
  delete mp.conns[id]; delete mp.P[id];
  if (G){
    G.boards.forEach(b => { for (const k in b.carry) if (b.carry[k] === id) delete b.carry[k]; });
    bc({t:'cur', id, p:null}); showCursor(id, null); pushSnap();
  }
  pushLobby();
}
function pushLobby(){ if (!mp || !mp.host) return; bc(lobbyMsg()); renderRoomHead(); }

function joinRoom(code){
  code = String(code || '').trim().toUpperCase(); if (!code) return;
  if (typeof Peer === 'undefined') return toast(t('neterr'));
  toast(t('connecting'));
  const peer = new Peer(); let ok = false, to;
  const fail = k => { if (ok) return; clearTimeout(to); try { peer.destroy(); } catch(e){} toast(t(k)); };
  to = setTimeout(() => fail('notfound'), 12000);
  peer.on('error', e => { if (!ok) fail(e.type === 'peer-unavailable' ? 'notfound' : 'neterr'); });
  peer.on('open', id => {
    const conn = peer.connect('blindmap-' + code, {reliable:true});
    conn.on('open', () => {
      clearTimeout(to); ok = true; $('#toast').hidden = true;
      mp = {host:false, peer, id, conn, code, room:null, type:'casual', team:0};
      conn.send({t:'hello', name:prof.name, pfp:prof.pfp});
      scr = 'lobby'; lobbyClient();
    });
    conn.on('data', m => { if (mp && mp.conn === conn && m && typeof m === 'object') clientMsg(m); });
    conn.on('close', () => { if (mp && mp.conn === conn) leaveRoom('hostleft'); });
  });
}

function clientMsg(m){
  switch (m.t){
    case 'lobby':
      mp.room = m; mp.type = m.type;
      if (scr === 'lobby') lobbyClient();
      break;
    case 'start':
      sel = new Set(m.sel); oceans = !!m.oceans; mp.type = m.type; mp.team = m.teams[mp.id] || 0;
      begin(m.keys); break;
    case 'snap': applySnap(m); break;
    case 'cur': showCursor(m.id, m.p); break;
    case 'deny': curDrag && curDrag.abort(); break;
    case 'end': showResults(m); break;
    case 'rej': leaveRoom(m.why); break;
  }
}

// ---- host authority ----
function hostStart(){
  if (!mp || !mp.host || (!sel.size && !oceans)) return;
  const ps = Object.values(mp.P);
  if (mp.type === 'vs' && (!ps.some(q => q.team === 0) || !ps.some(q => q.team === 1))){ const e = $('#rmsg'); if (e) e.textContent = t('need2'); return; }
  const keys = [...sel].map(i => 'c' + i); if (oceans) OCEANS.forEach((_,i) => keys.push('o' + i));
  shuffle(keys); // random order in multiplayer
  const vs = mp.type === 'vs', teams = {};
  ps.forEach(q => teams[q.id] = vs ? q.team : 0);
  G = {boards:(vs ? [0,1] : [0]).map(() => ({left:new Set(keys), placed:{}, carry:{}})), team:teams, stats:{}, info:{}, grab:{}, t0:Date.now(), total:keys.length};
  ps.forEach(q => { G.stats[q.id] = {placed:0, miss:0, holdMs:0, holdN:0}; G.info[q.id] = {name:q.name, pfp:q.pfp, team:teams[q.id]}; });
  mp.phase = 'play'; mp.team = teams[mp.id];
  bc({t:'start', type:mp.type, keys, teams, sel:[...sel], oceans});
  begin(keys);
}
function relayCur(from, p){
  if (!G) return;
  const tm = G.team[from];
  bc({t:'cur', id:from, p}, id => id !== from && G.team[id] === tm);
  if (from !== mp.id && G.team[mp.id] === tm) showCursor(from, p);
}
function pushSnap(){
  if (!G) return;
  const m = {t:'snap', b:G.boards.map(b => ({l:b.left.size, p:Object.entries(b.placed), c:b.carry})),
    s:Object.fromEntries(Object.entries(G.stats).map(([i,s]) => [i, [s.placed, s.miss]]))};
  bc(m); applySnap(m);
}
function hostApply(id, m){
  const p = mp.P[id]; if (!p) return;
  switch (m.t){
    case 'prof':
      p.name = cleanName(m.name); p.pfp = cleanPfp(m.pfp);
      if (G && G.info[id]){ G.info[id].name = p.name; G.info[id].pfp = p.pfp; }
      pushLobby(); break;
    case 'team':
      if (mp.phase === 'lobby' && (m.team === 0 || m.team === 1)){ p.team = m.team; pushLobby(); } break;
    case 'cur':
      if (m.p === null || (Array.isArray(m.p) && isFinite(m.p[0]) && isFinite(m.p[1]))) relayCur(id, m.p); break;
    case 'grab': {
      if (!G) return;
      const b = G.boards[G.team[id]]; if (!b) return; const k = m.k;
      if (typeof k !== 'string' || !b.left.has(k) || b.carry[k]){ sendTo(id, {t:'deny', k}); return; }
      for (const kk in b.carry) if (b.carry[kk] === id) delete b.carry[kk];
      b.carry[k] = id; G.grab[id] = Date.now(); pushSnap(); break;
    }
    case 'drop': {
      if (!G) return;
      const tm = G.team[id], b = G.boards[tm], k = m.k;
      if (!b || b.carry[k] !== id) return;
      delete b.carry[k]; const s = G.stats[id];
      if (m.cancel){}
      else if (m.ok){ b.left.delete(k); b.placed[k] = id; s.placed++; s.holdMs += Date.now() - (G.grab[id] || Date.now()); s.holdN++; }
      else s.miss++;
      pushSnap();
      if (b.left.size === 0) finishGame(tm);
      break;
    }
  }
}
function finishGame(win){
  const players = Object.keys(G.info).map(id => ({...G.info[id], ...G.stats[id], id}));
  const m = {t:'end', win, type:mp.type, ms:Date.now() - G.t0, total:G.total, players};
  mp.phase = 'lobby'; G = null; bc(m); showResults(m);
}

// ---- cursors & snapshot rendering (all players) ----
function sendCur(x,y){
  let p = null;
  if (x < innerWidth - sideW() && y >= 0 && x >= 0){
    const q = d3.zoomTransform(svg.node()).invert([x,y]), ll = proj.invert(q);
    if (ll && isFinite(ll[0]) && isFinite(ll[1])) p = [+ll[0].toFixed(3), +ll[1].toFixed(3)];
  }
  if (!p && lastNull) return; lastNull = !p;
  if (mp.host) relayCur(mp.id, p); else if (mp.conn.open) mp.conn.send({t:'cur', p});
}
addEventListener('pointermove', e => {
  if (!mp || !playing || !svg) return;
  const n = performance.now(); if (n - lastSend < 45) return; lastSend = n;
  sendCur(e.clientX, e.clientY);
});
function showCursor(id, p){
  if (!cl || !playing) return;
  let c = cur[id];
  if (!p){ if (c){ c.remove(); delete cur[id]; } return; }
  const xy = proj(p); if (!xy) return;
  if (!c){
    c = cur[id] = cl.append('g').attr('class','rc');
    const s = c.append('g').attr('class','cs').attr('transform', `scale(${1/curK})`);
    s.append('path').attr('class','cp').attr('d','M0,0 L0,17 L4.5,13 L8,20 L10.5,19 L7,12 L13,12 Z');
    const q = getP(id); s.append('text').attr('class','cn').attr('x',14).attr('y',26).text(q ? q.name : '');
    const ci = s.append('g').attr('class','ci').attr('transform','translate(14,46)').attr('display','none');
    ci.append('rect'); ci.append('text');
    if (mpSnap){ const b = mpSnap.b[myBoard()]; setCarry(id, Object.keys(b.c).find(k => b.c[k] === id)); }
  }
  c.style('transform', `translate(${xy[0]}px,${xy[1]}px)`);
}
function setCarry(id, k){
  const c = cur[id]; if (!c) return; const ci = c.select('.ci');
  if (!k){ ci.attr('display','none'); return; }
  const tx = ci.select('text').text(itemName(k)); ci.attr('display', null);
  const bb = tx.node().getBBox();
  ci.select('rect').attr('x', bb.x - 5).attr('y', bb.y - 2).attr('width', bb.width + 10).attr('height', bb.height + 4).attr('rx', 3);
}
function applySnap(m){
  mpSnap = m; if (!playing || !state || !mp) return;
  const b = m.b[myBoard()], side = $('#side');
  for (const [k] of b.p){
    if (!mpPlaced.has(k)){ mpPlaced.add(k); markPlaced(k); }
    const el = side.querySelector(`[data-k="${k}"]`); if (el) el.remove();
  }
  side.querySelectorAll('.it').forEach(el => {
    const by = b.c[el.dataset.k], taken = by && by !== mp.id;
    el.classList.toggle('taken', !!taken);
    if (taken){ const q = getP(by); el.dataset.by = q ? q.name : ''; } else delete el.dataset.by;
  });
  for (const id in cur) setCarry(id, Object.keys(b.c).find(k => b.c[k] === id));
  hud();
}

// ================= results / MVP =================
function showResults(m){
  clearInterval(timer); playing = false; scr = 'results'; cl = null; cur = {};
  $('#side').hidden = $('#hud').hidden = true;
  const p = $('#panel'); p.hidden = false; p.className = 'box auto'; applyDir();
  const P = m.players, s = Math.floor(m.ms / 1000), tm = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  const misses = P.reduce((a,q) => a + q.miss, 0);
  const head = m.type === 'vs' ? (m.win === mp.team ? t('won') : t('lost')) : t('done');
  const sub = m.type === 'vs' ? `<span class="tcol t${m.win}">${t('vsWin').replace('{n}', m.win + 1)}</span> · ${tm}` : `${m.total} ✓ · ${tm} · ${misses} ${t('miss').toLowerCase()}`;
  const att = q => q.placed + q.miss, avg = q => q.holdN ? q.holdMs / q.holdN : null;
  const W = (q, f, best) => P.filter(x => f(x) === best);
  const pick = (f, dir) => { let best = null; for (const q of P){ const v = f(q); if (v === null) continue; if (best === null || (dir > 0 ? v > best : v < best)) best = v; } return best; };
  const cats = [
    ['🎯', t('c_guess'), q => q.placed, 1, v => v],
    ['💥', t('c_miss'), q => q.miss, 1, v => v],
    ['🏹', t('c_acc'), q => att(q) ? q.placed / att(q) : null, 1, v => Math.round(v * 100) + '%'],
    ['⚡', t('c_fast'), avg, -1, v => (v/1000).toFixed(1) + 's · ' + t('avg')],
    ['🐢', t('c_slow'), avg, 1, v => (v/1000).toFixed(1) + 's · ' + t('avg')]
  ];
  const who = ws => ws.map(q => `<span class="w">${av(q,30)}<b>${esc(q.name)}</b></span>`).join('');
  const cards = cats.map(([ic, ti, f, dir, fmt]) => {
    const best = pick(f, dir); if (best === null) return '';
    if (ti === t('c_miss') && best === 0) return `<div class="cat"><div class="ct">${ic} ${ti}</div><div class="cw">🎉 ${t('nomiss')}</div></div>`;
    if (ti === t('c_guess') && best === 0) return '';
    return `<div class="cat"><div class="ct">${ic} ${ti}</div><div class="cw">${who(W(null, f, best))}</div><div class="cv">${fmt(best)}</div></div>`;
  }).join('');
  const score = q => q.placed - q.miss * .5, top = Math.max(...P.map(score));
  const mvp = P.filter(q => score(q) === top);
  p.innerHTML = `<h1>${head}</h1><p>${sub}</p>
  <div class="mvp"><div class="ct">👑 ${t('mvp')}</div><div class="cw">${who(mvp)}</div><div class="cv">${mvp.map(q => q.placed + ' ✓ / ' + q.miss + ' ✗').join(' · ')}</div></div>
  <div class="cats">${cards}</div>
  <button class="go" data-a="lobby">${t('tolobby')}</button>`;
  p.onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.a) roomAction(b.dataset.a); };
  p.onchange = p.oninput = p.onkeydown = null;
}

// ================= init =================
renderMe(); $('#me').onclick = openProf; document.getElementById('map').addEventListener('click', onPick);
</script>
